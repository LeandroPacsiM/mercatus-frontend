<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Carousel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .logo-marquee {
            width: 100%;
            overflow: hidden;

            /* Oculta suavemente los extremos */
            mask-image: linear-gradient(to right,
                    transparent,
                    black 10%,
                    black 90%,
                    transparent);

            -webkit-mask-image: linear-gradient(to right,
                    transparent,
                    black 10%,
                    black 90%,
                    transparent);
        }

        .logo-track {
            display: flex;
            width: max-content;
            animation: scroll 25s linear infinite;
        }

        .logo-track:hover {
            animation-play-state: paused;
        }

        .logo {
            min-width: 220px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;

            color: white;

            filter: grayscale(100%);
            opacity: .35;

            transition: all .4s ease;
        }

        .logo:hover {
            filter: grayscale(0%);
            opacity: 1;
            transform: scale(1.08);
        }

        @keyframes scroll {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>

    <div class="logo-marquee">
        <div class="logo-track">

            <!-- Grupo 1 -->
            <div class="logo">VISA</div>
            <div class="logo">STRIPE</div>
            <div class="logo">AIRBNB</div>
            <div class="logo">NOTION</div>
            <div class="logo">SHOPIFY</div>
            <div class="logo">SPOTIFY</div>

            <!-- Duplicado para loop infinito -->
            <div class="logo">VISA</div>
            <div class="logo">STRIPE</div>
            <div class="logo">AIRBNB</div>
            <div class="logo">NOTION</div>
            <div class="logo">SHOPIFY</div>
            <div class="logo">SPOTIFY</div>

        </div>
    </div>

</body>

</html>
